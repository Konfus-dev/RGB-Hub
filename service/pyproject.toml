[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbhub"
version = "0.1.0"
description = "One service for every lit device: HP OMEN 45L cooler LCD, case and RAM lights, IQUNIX MG65 keyboard"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
# Pillow and PyGObject come from the system (the venv uses --system-site-packages).
dependencies = ["openrgb-python==0.3.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
# rgbhub and its sub-packages (core, devices, platforms).
include = ["rgbhub*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:gi.*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, modern syntax.
select = ["E", "F", "I", "B", "UP"]
